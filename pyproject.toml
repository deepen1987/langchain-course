[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deependrasingh Shekhawat", email = "deepen1987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "preshed<3.0.14",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.34",
    "unstructured-client>=0.46.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
